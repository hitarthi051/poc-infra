AWSTemplateFormatVersion: '2010-09-09'
Description: API Gateway without any methods

Parameters:
  BranchName:
    Description: Branch name
    Type: String
    Default: "v1"

Resources:

  CodeBuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Principal:
              Service:
                - 'codebuild.amazonaws.com'
            Effect: Allow
        Version: 2012-10-17
      Description: Grant AWS services access to Code Build
      Path: /
      Policies:
        - PolicyName: zero-downtime-poc-code-build-admin-access-v3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action: '*'
                Effect: Allow
                Resource: '*'
      RoleName: 'zero-downtime-poc-code-build-role-v3'
      Tags:
        - Key: 'zero-downtime-poc-code-build-role'
          Value: 'zero-downtime-poc-code-build-role'

  CodePipelineRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - 'codepipeline.amazonaws.com'
        Version: '2012-10-17'
      Path: /
      Policies:
        - PolicyName: zero-downtime-poc-code-pipeline-admin-access-v3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - '*'
                Effect: Allow
                Resource: '*'
      RoleName: 'zero-downtime-poc-code-pipeline-role-v3'
      Tags:
        - Key: 'zero-downtime-poc-code-pipeline-role'
          Value: 'zero-downtime-poc-code-pipeline-role'

  CloudFormationRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - 'cloudformation.amazonaws.com'
        Version: '2012-10-17'
      Path: '/'
      Policies:
        - PolicyName: zero-downtime-poc-cloud-formation-admin-access-v3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action: '*'
                Effect: Allow
                Resource: '*'
      RoleName: 'zero-downtime-poc-cloud-formation-role-v3'
      Tags:
        - Key: 'zero-downtime-poc-cloud-formation-role'
          Value: 'zero-downtime-poc-cloud-formation-role'

  SSMCodePipelineRole:
    Type: "AWS::SSM::Parameter"
    Properties:
      Type: String
      Description: !Sub "Code Pipeline Role ARN"
      Value: !GetAtt CodePipelineRole.Arn
      Name: "/zero-downtime-poc/codepipelinerole/arn"

  CloudFormationPackageS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-cloudformation-scripts-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  SSMCloudFormationBucket:
    DependsOn: CloudFormationPackageS3Bucket
    Type: 'AWS::SSM::Parameter'
    Properties:
      Type: String
      Description: !Sub 'Value of S3 bucket cloudformation-scripts'
      Value: !Ref CloudFormationPackageS3Bucket
      Name: '/zero-downtime-poc/s3/cloudformation-scripts'
         
  ArtifactStoreS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-devops-artifact-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  SSMArtifactBucket:
    DependsOn: ArtifactStoreS3Bucket
    Type: 'AWS::SSM::Parameter'
    Properties:
      Type: String
      Value: !Ref ArtifactStoreS3Bucket
      Name: '/zero-downtime-poc/s3/devops-artifacts'

  SSMArtifactBucketArn:
    DependsOn: ArtifactStoreS3Bucket
    Type: 'AWS::SSM::Parameter'
    Properties:
      Type: String
      Description: !Sub 'Arn of S3 bucket for DevOps artifacts'
      Value: !GetAtt ArtifactStoreS3Bucket.Arn
      Name: '/zero-downtime-poc/s3/devops-artifacts/arn'

  smoketestS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-smoketest-script-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  databaseS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: zero-downtime-poc-database-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

#source
  InfrastructureZeroDowntimeBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: infrastructure-source-poc-zero-downtime-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

#source
  UIZeroDowntimeBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: ui-source-poc-zero-downtime-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

#source
  APIZeroDowntimeBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: api-source-poc-zero-downtime-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled

  UIBuildArtifactsStoreBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: ui-artifacts-poc-zero-downtime-v3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html  # The default document (can be any HTML file)
        ErrorDocument: error.html
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled
            
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UIBuildArtifactsStoreBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCloudFrontServicePrincipal"
            Effect: "Allow"
            Principal:
              Service: "cloudfront.amazonaws.com"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${UIBuildArtifactsStoreBucket}/*"

  UIBuildArtifactsStoreBucketB:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: ui-artifacts-poc-zero-downtime-v3-b
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html  
        ErrorDocument: error.html
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled
            
  BucketPolicyB:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UIBuildArtifactsStoreBucketB
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCloudFrontServicePrincipal"
            Effect: "Allow"
            Principal:
              Service: "cloudfront.amazonaws.com"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${UIBuildArtifactsStoreBucketB}/*"

  InfrastructureCodeBuild:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Description: Infrastructure CloudFormation Build & Packaging
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/hitarthi051/poc-infra"
        BuildSpec: !Sub "buildspec/config.yml"
        GitCloneDepth: 1
      Name: zero-downtime-poc-infrastructure
      Artifacts:
        Location: !Ref ArtifactStoreS3Bucket
        Name: 'zero-downtime-poc-infrastructure.zip'
        NamespaceType: NONE
        OverrideArtifactName: true
        Packaging: ZIP
        Type: S3
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 30
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/standard:6.0"
        Type: LINUX_CONTAINER
      TimeoutInMinutes: 15

  WeightshifCodeBuild:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/hitarthi051/poc-infra"
        BuildSpec: !Sub "buildspec/weight-shift-buildspec.yml"
        GitCloneDepth: 1
      Name: zero-downtime-poc-infrastructure-weight-shift
      Artifacts:
        Location: !Ref ArtifactStoreS3Bucket
        Name: 'zero-downtime-poc-infrastructure-weight-shift.zip'
        NamespaceType: NONE
        OverrideArtifactName: true
        Packaging: ZIP
        Type: S3
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 30
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/standard:6.0"
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: HOSTED_ZONE_ID
            Value: ""
          - Name: RECORD_NAME
            Value: ""
          - Name: CLOUDFRONT_CANARY
            Value: ""
          - Name: CLOUDFRONT_STABLE
            Value: ""
          - Name: STABLE_WEIGHT
            Value: ""
          - Name: CANARY_WEIGHT
            Value: ""
          - Name: STABLE_TAG
            Value: ""
          - Name: STAGE
            Value: ""
          - Name: APIID
            Value: ""
          - Name: CANARY_TAG
            Value: ""
      TimeoutInMinutes: 15

  UICodeBuild:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub "buildspec/ui-config.yml"
      # SourceVersion: !Ref BranchName
      Name: zero-downtime-poc-ui
      Artifacts:
        Type: CODEPIPELINE
        # Location: !Ref UIBuildArtifactsStoreBucket
        # Name: 'zero-downtime-poc-ui.zip'
        # NamespaceType: NONE
        # OverrideArtifactName: true
        # Packaging: ZIP
        # Type: S3
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 60
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/standard:6.0"
        Type: LINUX_CONTAINER
        EnvironmentVariables:
           - Name: UIARTIFACTBUCKETNAME
             Type: PLAINTEXT
             Value: ""
      TimeoutInMinutes: 90

  DeploymentPipelineCodeBuild:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/hitarthi051/poc-infra"
        BuildSpec: !Sub "buildspec/pipeline-config.yml"
        GitCloneDepth: 1
      SourceVersion: !Ref BranchName
      Name: zero-downtime-deployment-pipeline
      Artifacts:
        Location: !Ref ArtifactStoreS3Bucket
        Name: 'zero-downtime-deployment-pipeline.zip'
        NamespaceType: NONE
        OverrideArtifactName: true
        Packaging: ZIP
        Type: S3
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 60
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/standard:6.0"
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ARTIFACTBUCKETNAME
            Type: PLAINTEXT
            Value: !Ref ArtifactStoreS3Bucket
          - Name: DEPLOYAPI
            Value: ""
          - Name: UIARTIFACTBUCKETNAME
            Value: ""
          - Name: BlueOrGreen
            Value: ""
          - Name: APIBranch
            Value: ""
          - Name: DEPLOYDB
            Value: ""
          - Name: DEPLOYUI
            Value: ""
          - Name: UIBranch
            Value: ""
          - Name: CANARY
            Value: ""
          - Name: HOSTED_ZONE_ID
            Value: ""
          - Name: RECORD_NAME
            Value: ""
          # - Name: CLOUDFRONT_STABLE
          #   Value: ""
          # - Name: CLOUDFRONT_CANARY
          #   Value: ""
          - Name: STABLE_WEIGHT
            Value: "0"
          - Name: CANARY_WEIGHT
            Value: "100"
          - Name: CANARY_TAG
            Value: ""
          - Name: STABLE_TAG
            Value: ""
          - Name: APIID
            Value: ""
          - Name: Githubtoken
            Value: ""
          - Name: S3Bucket
            Value: ""
            
            
      TimeoutInMinutes: 90

  APICodeBuild:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/hitarthi051/poc-api"
        BuildSpec: !Sub "buildspec/api-config.yml"
        GitCloneDepth: 1
      SourceVersion: !Ref BranchName
      Name: zero-downtime-poc-api
      Artifacts:
        Location: !Ref ArtifactStoreS3Bucket
        Name: 'zero-downtime-poc-api.zip'
        NamespaceType: NONE
        OverrideArtifactName: true
        Packaging: ZIP
        Type: S3
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 60
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/standard:7.0"
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: STAGE
            Value: ""
      TimeoutInMinutes: 90

  SmokeTestCodeBuild:
    Type: "AWS::CodeBuild::Project"
    Properties:
      Description: Code Build for Smoke tests
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/IshanBhattTatvasoft/poc-smoketest"
        BuildSpec: !Sub "buildspec/smoketest.yml"
        GitCloneDepth: 1
      Name: zero-downtime-poc-smoke-test
      Artifacts:
        Type: NO_ARTIFACTS
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 30
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: "aws/codebuild/standard:7.0"
        Type: LINUX_CONTAINER
      TimeoutInMinutes: 90

  DatabaseCodeBuild:
    Type: "AWS::CodeBuild::Project"
    Properties:
      Description: Code Build for Smoke tests
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/IshanBhattTatvasoft/poc-db"
        BuildSpec: !Sub "buildspec/db.yml"
        GitCloneDepth: 1
      Name: zero-downtime-poc-database
      Artifacts:
        Type: NO_ARTIFACTS
      ServiceRole: !Ref CodeBuildRole
      QueuedTimeoutInMinutes: 30
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: "aws/codebuild/standard:7.0"
        Type: LINUX_CONTAINER
      TimeoutInMinutes: 90

  SinglePipeline:
    Type: "AWS::CodePipeline::Pipeline"
    Properties:
      # Description: Codepipeline
      ArtifactStore:
        Location: !Ref ArtifactStoreS3Bucket
        Type: S3
      Name: zero-downtime-poc-single-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      RestartExecutionOnUpdate: false
      Stages:
        - Name: Source
          Actions:
            - Name: Infra-Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Sub '${ArtifactStoreS3Bucket}'
                PollForSourceChanges: false
                S3ObjectKey: zero-downtime-poc-infrastructure.zip
              OutputArtifacts:
                - Name: zero-downtime-poc-Infrastructure-SourceOutput
              RunOrder: '1'
            - Name: UI-Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Sub '${UIBuildArtifactsStoreBucket}'
                PollForSourceChanges: false
                S3ObjectKey: zero-downtime-poc-ui.zip
              OutputArtifacts:
                - Name: zero-downtime-poc-UI-SourceOutput
              RunOrder: '1'
        - Name: Manual-approval1
          Actions:
            - Name: approval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: "test"
              RunOrder: '1'
        - Name: Infrastructure-deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              InputArtifacts:
                - Name: zero-downtime-poc-Infrastructure-SourceOutput
              Configuration:
                ActionMode: CREATE_UPDATE
                RoleArn: !GetAtt CloudFormationRole.Arn
                StackName: "poc-infra"
                Capabilities: CAPABILITY_NAMED_IAM
                ChangeSetName: "poc-Infrastructure-Update"
                TemplatePath: "zero-downtime-poc-Infrastructure-SourceOutput::main.template"
                # TemplateConfiguration: "Infrastructure-SourceOutput::jhgj-config.json"
              RunOrder: "2"
        - Name: UI-deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: "1"
              InputArtifacts:
                - Name: zero-downtime-poc-UI-SourceOutput
              Configuration:
                BucketName: !Ref UIBuildArtifactsStoreBucket
                Extract: true
              RunOrder: "2"

